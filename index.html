<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rakibx All Site</title>
<meta name="description" content="Rakibx All Site - all my websites in one place.">
<meta property="og:title" content="Rakibx All Site">
<meta property="og:description" content="Rakibx All Site - all my websites in one place.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:190}
:root{--h:190;--c1:hsl(var(--h) 100% 55%);--bg:#050816;--txt:#f4f6ff;--mut:#9fb0d6;--gl:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);color-scheme:dark;transition:--h 60s linear;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Outfit',system-ui,sans-serif;color:var(--txt);background:radial-gradient(700px 500px at 0% 0%,hsl(var(--h) 90% 16%),transparent),radial-gradient(700px 500px at 100% 100%,hsl(calc(var(--h) + 80) 80% 15%),transparent),var(--bg);overflow-x:hidden}
.dots{position:fixed;inset:0;z-index:0;pointer-events:none}
.dots i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--c1);opacity:.5;animation:rise 9s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}20%{opacity:.7}to{transform:translateY(-110vh);opacity:0}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:14px 12px 40px}
.shell{border:1px solid hsl(var(--h) 80% 40%/.5);border-radius:34px;padding:22px 16px 16px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));box-shadow:0 0 50px hsl(var(--h) 100% 50%/.15),inset 0 0 40px hsl(var(--h) 100% 50%/.06);animation:in .8s both}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:1px;display:flex;align-items:baseline;gap:10px}
h1 span{font-size:21px;font-weight:700;color:var(--c1);letter-spacing:3px;text-shadow:0 0 14px var(--c1)}
.gear{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--c1);background:hsl(var(--h) 100% 50%/.08);color:var(--c1);font-size:22px;display:grid;place-items:center;text-decoration:none;box-shadow:0 0 16px hsl(var(--h) 100% 50%/.3);transition:transform .5s}
.gear:hover{transform:rotate(120deg)}
.hi{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px;font-size:18px;font-weight:700}
.hi b{color:var(--c1);text-shadow:0 0 12px var(--c1);font-variant-numeric:tabular-nums}
.note{border:1px solid hsl(var(--h) 70% 35%/.6);background:hsl(var(--h) 80% 30%/.12);border-radius:18px;padding:13px;text-align:center;color:var(--mut);margin-bottom:14px;font-size:14px;line-height:1.4}
.card{--o:0;position:relative;display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:11px;border-radius:22px;text-decoration:none;color:var(--txt);background:rgba(10,14,40,.55);animation:in .7s both;transition:transform .3s,box-shadow .3s;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(135deg,hsl(calc(var(--h) + var(--o)) 100% 58%),hsl(calc(var(--h) + var(--o) + 110) 100% 60%),hsl(calc(var(--h) + var(--o)) 100% 58%));background-size:250% 250%;animation:flow 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card::after{content:"";position:absolute;top:0;left:-120%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);transition:left .8s}
.card:hover,.card:active{transform:translateY(-3px);box-shadow:0 10px 30px hsl(calc(var(--h) + var(--o)) 100% 50%/.3)}
.card:hover::after{left:140%}
@keyframes flow{50%{background-position:100% 100%}}
.ic{position:relative;flex:none;width:52px;height:52px;border-radius:16px;background:#080c22;display:grid;place-items:center;font-size:26px;border:1.5px solid hsl(calc(var(--h) + var(--o)) 90% 55%/.7);box-shadow:0 0 14px hsl(calc(var(--h) + var(--o)) 100% 50%/.35)}
.dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:#22e07a;box-shadow:0 0 8px #22e07a}
.tx{flex:1;min-width:0}
.tx h2{margin:0 0 1px;font-size:18px;font-weight:800;background:linear-gradient(90deg,hsl(calc(var(--h) + var(--o)) 100% 68%),hsl(calc(var(--h) + var(--o) + 80) 100% 70%));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.tx p{margin:0;color:var(--mut);font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.side{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.bdg{font-size:10px;font-weight:800;letter-spacing:1.5px;padding:2px 9px;border-radius:999px;background:linear-gradient(90deg,#14d6ff,#6a5cff);color:#fff}
.go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#fff;background:linear-gradient(135deg,hsl(calc(var(--h) + var(--o)) 100% 58%),hsl(calc(var(--h) + var(--o) + 80) 100% 60%));box-shadow:0 0 14px hsl(calc(var(--h) + var(--o)) 100% 50%/.55);transition:transform .3s}
.card:hover .go{transform:translateX(3px) scale(1.1)}
.foot{border:1px solid hsl(var(--h) 70% 35%/.6);border-radius:18px;padding:13px;text-align:center;letter-spacing:5px;font-weight:600;font-size:15px;color:var(--mut);margin-top:14px}
.foot b{color:var(--c1);text-shadow:0 0 12px var(--c1)}
.ver{text-align:center;font-size:11px;color:var(--mut);opacity:.5;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:20px}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.hide{display:none!important}
.lk{text-align:center;padding:10px 4px 6px}
.lk .big{font-size:54px;filter:drop-shadow(0 0 14px var(--c1))}
.lk input{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:11px 14px;margin:12px 0 8px;outline:0;text-align:center}
.lk input:focus{border-color:var(--c1)}
.lk button{font:inherit;font-weight:700;border:0;cursor:pointer;color:#fff;padding:11px 28px;border-radius:999px;background:linear-gradient(135deg,hsl(var(--h) 100% 55%),hsl(calc(var(--h) + 80) 100% 60%));box-shadow:0 0 16px hsl(var(--h) 100% 50%/.5)}
.lk .lm{min-height:20px;color:#ff6b81;font-size:14px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="dots" id="dots"></div>
<div class="wrap"><div class="shell">
  <div class="top"><h1 id="ttl">MY<span>SITES</span></h1><a class="gear" href="admin.html" aria-label="Admin">&#9881;</a></div>
  <div class="hi"><span id="greet"></span><b id="clock"></b></div>
  <div class="note" id="tag">Loading...</div>
  <div class="lk hide" id="lk"><div class="big">&#128274;</div><input type="password" id="lpw" placeholder="Password" autocomplete="off"><div class="lm" id="lm"></div><button id="lgo">Open</button></div>
  <div id="grid"></div>
  <div class="foot" id="ft">MADE BY <b id="by"></b></div>
  <div class="ver">v1.0</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();
const unb=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function key(p,salt){const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function unlock(o,p){const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(o.i)},await key(p,unb(o.s)),unb(o.d));return JSON.parse(dec.decode(d))}
let J=null;
async function tryOpen(p,silent){
  try{const D=await unlock(J,p);try{sessionStorage.setItem('sl',p)}catch(e){}
    $('lk').classList.add('hide');$('ft').classList.remove('hide');render(D)}
  catch(e){if(!silent)$('lm').textContent='Wrong password'}
}
function showLock(){
  $('tag').textContent='This site is locked.';$('by').textContent='';$('lk').classList.remove('hide');$('ft').classList.add('hide');
  let p=null;try{p=sessionStorage.getItem('sl')}catch(e){}
  if(p)tryOpen(p,true);
}
const safe=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}};
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(D){
  const t=$('ttl');t.textContent=D.title||'';t.append(mk('span',0,D.accent||''));
  $('tag').textContent=D.tag||'';$('by').textContent=D.by||'';
  const g=$('grid');g.innerHTML='';
  const L=D.sites||[];
  if(!L.length)g.append(mk('div','empty','No websites yet.'));
  L.forEach((x,i)=>{
    const u=safe(x.url);if(!u)return;
    const a=mk('a','card');a.href=u;a.target='_blank';a.rel='noopener noreferrer';
    a.style.setProperty('--o',[0,-150,-20,-60,100][i%5]+Math.floor(i/5)*30);a.style.animationDelay=(i*.1)+'s';
    const ic=mk('div','ic',x.icon||'\ud83c\udf10');ic.append(mk('i','dot'));
    const tx=mk('div','tx');tx.append(mk('h2',0,x.name));
    if(x.desc)tx.append(mk('p',0,x.desc));
    const sd=mk('div','side');if(x.badge)sd.append(mk('div','bdg',x.badge));
    sd.append(mk('div','go','\u2192'));
    a.append(ic,tx,sd);g.append(a);
  });
}
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),p=(h*60+m)/1440;
  document.documentElement.style.setProperty('--h',Math.round(200+110*Math.sin(p*2*Math.PI-1.2)));
  $('greet').textContent=(h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night')+' \ud83d\udc4b';
  $('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
const dd=$('dots');for(let i=0;i<14;i++){const e=mk('i');e.style.left=(Math.random()*100)+'%';e.style.top=(60+Math.random()*50)+'%';e.style.animationDelay=(-Math.random()*9)+'s';e.style.animationDuration=(7+Math.random()*8)+'s';dd.append(e)}
tick();setInterval(tick,30000);
$('lgo').onclick=()=>tryOpen($('lpw').value,false);
$('lpw').onkeydown=e=>{if(e.key==='Enter')$('lgo').click()};
fetch('my-sites-data.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()})
.then(j=>{if(j.locked){J=j;showLock()}else render(j)}).catch(()=>{$('tag').textContent='Could not load my-sites-data.json. Open this page from your GitHub Pages link.'});
</script>
</body>
</html>
